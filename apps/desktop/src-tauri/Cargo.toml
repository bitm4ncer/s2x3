[package]
name = "slope3-desktop"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "slope3_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
slope3-core = { path = "../../../crates/slope3-core" }
slope3-engines = { path = "../../../crates/slope3-engines" }
