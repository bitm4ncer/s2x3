[workspace]
resolver = "2"
members = ["crates/s2x3-core", "crates/s2x3-engines", "crates/s2x3-cli"]
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
